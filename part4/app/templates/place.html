<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">
                <img src="./images/logo.png" alt="Hbnb Logo" class="logo">
            </a>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>
    <main>
        <section id="place-details">
            <div class="place-section">
                <div class="text-content">
                    <h2 class="place-info-title">Beach House</h2>
                    <p class="place-info"><strong>Host:</strong> John Doe</p>
                    <p class="place-info"><strong>Price per night:</strong> $150</p>
                    <p class="place-info"><strong>Description:</strong> A beautiful beach house with amazing views...</p>
                    <p class="place-info"><strong>Amenities:</strong> Wifi, Pool, Air Conditioning</p>
                </div>
                <div class="place-image">
                    <img src="./images/beach house.jpg" width="40px" alt="Beach House" class="">
                </div>
            </div>
        </section>
        <section id="reviews">
            <h2>Reviews</h2>
            <a href="add_review.html" class="add-review">Add a Review</a>
        </section>
        <section id="add-review">
            <h2>Add a Review</h2>
            <form id="review-form">
                <label for="review-text">Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>
                
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <script src="./js/place.js"></script>
</body>
</html>
